name: Java CI with Security Scanning

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: ./mvnw clean compile

    - name: Run SpotBugs
      run: ./mvnw spotbugs:check

    - name: Run OWASP Dependency-Check
      run: ./mvnw dependency-check:check -Dnvd.api.key=${{ secrets.NVD_API_KEY }}